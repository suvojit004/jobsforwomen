# =============================================================================
# HOST-level nginx config for the frontend domain (jobsforwomen.info).
#
# This is NOT the same file as frontend/nginx.conf. That one runs INSIDE the
# frontend Docker container, listens on :8080, and serves the static build
# with no TLS or domain awareness (server_name _).
#
# This file runs directly on the server (outside any container), alongside
# backend/nginx.conf, and is what actually terminates HTTPS for the public
# site. It just reverse-proxies to the frontend container's mapped port --
# install it the same way as backend/nginx.conf:
#
#   sudo cp frontend/nginx.host.conf /etc/nginx/sites-available/jobsforwomen.info
#   sudo ln -s /etc/nginx/sites-available/jobsforwomen.info /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d jobsforwomen.info -d www.jobsforwomen.info
#   sudo nginx -t && sudo systemctl reload nginx
#
# Assumes the frontend container is running with `-p 127.0.0.1:8080:8080`
# (see Section 7.3 of the Dockerize & Deploy guide).
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name jobsforwomen.info www.jobsforwomen.info;

    # Let's Encrypt / Certbot Challenge Directory -- same path convention as
    # backend/nginx.conf, so both domains can share one certbot renewal setup.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jobsforwomen.info www.jobsforwomen.info;

    # SSL Certificates (Managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/jobsforwomen.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobsforwomen.info/privkey.pem;

    # Secure SSL Protocols and Ciphers Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Session caching optimizations
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    #
    # IMPORTANT: unlike backend/nginx.conf's CSP (which locks everything down
    # because the API serves no HTML/JS of its own), a Content-Security-Policy
    # here MUST allow scripts, styles, and a connect-src back to the API
    # domain, or the React app itself won't run. Left unset by default --
    # frontend/nginx.conf (inside the container) has a commented-out example
    # CSP with the correct connect-src pattern; copy that here once you've
    # tested it against your real API origin.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression -- the frontend container's own nginx (frontend/nginx.conf)
    # already gzips its responses. Left here too in case this host proxy ever
    # serves the built `dist/` directly instead of proxying to the container.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Reverse proxy to the frontend container (see Section 7.3 of the deploy
    # guide: `docker run -p 127.0.0.1:8080:8080 ... jobsforwomen-web:latest`).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Note: no /socket.io/ location here. The frontend calls the backend's
    # Socket.IO endpoint directly at api.jobsforwomen.info (baked into the
    # bundle via VITE_API_URL at build time) -- this domain only ever serves
    # static files and never proxies to the backend container.
}
