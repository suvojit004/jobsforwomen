# =============================================================================
# ALTERNATIVE to frontend/nginx.host.conf: serves the built frontend directly
# from the host's filesystem, with NO frontend container involved at all.
#
# Use this instead of nginx.host.conf if you'd rather skip building/running
# frontend/Dockerfile in production. The backend still runs as a container
# either way -- this only replaces the frontend half.
#
# Setup:
#   1. Build once (on the server, or anywhere, then copy the output over):
#        cd frontend
#        echo 'VITE_API_URL="https://api.jobsforwomen.info"' > .env.production
#        npm ci
#        npm run build              # -> tsc -b && vite build, emits dist/
#
#   2. Copy the build output to a static path on the server:
#        sudo mkdir -p /var/www/jobsforwomen.info
#        sudo cp -r dist/* /var/www/jobsforwomen.info/
#        sudo chown -R www-data:www-data /var/www/jobsforwomen.info
#
#   3. Install this config the same way as nginx.host.conf:
#        sudo cp frontend/nginx.static.host.conf /etc/nginx/sites-available/jobsforwomen.info
#        sudo ln -s /etc/nginx/sites-available/jobsforwomen.info /etc/nginx/sites-enabled/
#        sudo certbot --nginx -d jobsforwomen.info -d www.jobsforwomen.info
#        sudo nginx -t && sudo systemctl reload nginx
#
#   4. Every time the frontend changes: rebuild, then re-copy dist/* over the
#      same path and reload nothing (nginx serves the new files immediately --
#      no container restart, no image rebuild). This is the main appeal of
#      this approach over the container: a deploy is "copy some files", not
#      "build and run an image".
#
# NOTE -- VITE_API_URL still only applies at build time. It has nothing to do
# with Docker specifically; Vite reads .env.production automatically when you
# run `npm run build`. Changing the API URL later still means rebuilding and
# re-copying dist/, exactly as with the container approach.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name jobsforwomen.info www.jobsforwomen.info;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jobsforwomen.info www.jobsforwomen.info;

    ssl_certificate /etc/letsencrypt/live/jobsforwomen.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobsforwomen.info/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/jobsforwomen.info;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Vite emits content-hashed filenames into /assets/, so those are safe to
    # cache forever -- a new build produces new filenames, never the same
    # name with different content.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # index.html must NEVER be cached -- it references the hashed bundle
    # filenames. A cached copy pins returning visitors to a previous deploy's
    # asset names, which 404 once those files are overwritten by the next
    # `cp -r dist/*`. This is the single most common cause of "the site broke
    # after we deployed" on a static SPA.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # Client-side routes (/candidate/dashboard, /recruiter/applicants, ...)
    # have no file on disk -- unmatched paths fall back to index.html and let
    # React Router resolve them. Without this, refreshing any nested route
    # returns a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
