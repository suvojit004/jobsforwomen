# =============================================================================
# nginx config for the JobsForWomen SPA container (see frontend/Dockerfile).
#
# This serves ONLY the static frontend. It does not proxy the API -- the
# browser talks to the backend directly at VITE_API_URL, which is why the
# backend's CORS allowlist must include this site's origin (see
# docs/OPERATIONS_RUNBOOK.md §2 and §5.1 step 4).
#
# Port 8080, not 80: the nginx-unprivileged base image runs as a non-root
# user, which cannot bind ports below 1024.
# =============================================================================

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container healthcheck target. Kept separate from `/` so the probe
    # doesn't depend on the SPA bundle being readable.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ---- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- Security headers ---------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy is deliberately NOT enabled by default. A CSP
    # for this app must at minimum allow `connect-src` to the API origin AND
    # its WebSocket scheme (Socket.IO), which is build-specific -- shipping an
    # untested one would silently break real-time chat and every API call.
    # To enable it, substitute your real API origin and verify in a browser
    # with the console open before deploying:
    #
    # add_header Content-Security-Policy "default-src 'self'; \
    #     script-src 'self'; \
    #     style-src 'self' 'unsafe-inline'; \
    #     img-src 'self' data: blob:; \
    #     font-src 'self' data:; \
    #     connect-src 'self' https://api.example.com wss://api.example.com; \
    #     frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # ---- Caching ------------------------------------------------------------
    # Vite emits content-hashed filenames into /assets/, so those are safe to
    # cache forever -- a new build produces new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Everything else that looks like a static asset, cached briefly.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # index.html must NEVER be cached. It's the file that references the
    # hashed bundles; a cached copy pins returning visitors to a previous
    # deploy's assets, which 404 once the old files are gone. This is the
    # single most common cause of "the site broke after we deployed" on
    # containerised SPAs.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # ---- SPA fallback -------------------------------------------------------
    # Client-side routes (/candidate/dashboard, /recruiter/applicants, ...)
    # have no file on disk, so unmatched paths return index.html and let
    # React Router resolve them. Equivalent to the rewrite in vercel.json --
    # without this, refreshing any nested route returns a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't serve dotfiles if any ever end up in the build output.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
