# =============================================================================
# HOST-level nginx config for the single-domain production setup:
# https://portal.jobsforwomen.info serves BOTH the frontend and the backend
# API from one origin (confirmed -- not the split jobsforwomen.info /
# api.jobsforwomen.info subdomains that backend/nginx.conf and
# frontend/nginx.host.conf were originally written for).
#
# This file REPLACES both of those for this deployment -- do not run all
# three at once, they'd conflict on the same domain/ports. backend/nginx.conf
# and frontend/nginx.host.conf are left in the repo untouched as reference /
# in case the project ever splits back into subdomains.
#
# Routes by PATH to the two containers started by docker-compose.prod.yml:
#   /api/*, /socket.io/*, /files/*, /live, /ready, /health, /version
#     -> backend container on 127.0.0.1:5000
#   everything else
#     -> frontend container on 127.0.0.1:8080 (which does its own SPA
#        fallback -- see frontend/nginx.conf, running INSIDE that container)
#
# Install the same way as the repo's other host-level configs:
#   sudo cp portal.nginx.conf /etc/nginx/sites-available/portal.jobsforwomen.info
#   sudo ln -s /etc/nginx/sites-available/portal.jobsforwomen.info /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d portal.jobsforwomen.info
#   sudo nginx -t && sudo systemctl reload nginx
#
# Assumes docker-compose.prod.yml is already up, with `api` bound to
# 127.0.0.1:5000 and `web` bound to 127.0.0.1:8080 (both loopback-only --
# this nginx is the only thing that should be reachable from the internet).
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name portal.jobsforwomen.info;

    # Let's Encrypt / Certbot challenge directory -- same convention as
    # backend/nginx.conf and frontend/nginx.host.conf.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.jobsforwomen.info;

    # SSL certificates (managed by Let's Encrypt / Certbot).
    ssl_certificate /etc/letsencrypt/live/portal.jobsforwomen.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.jobsforwomen.info/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No Content-Security-Policy set here, deliberately. A CSP for a domain
    # that serves BOTH the React app AND the API has to allow scripts/styles
    # for the frontend while not being so strict it blocks Swagger UI at
    # /api/v1/api-docs (the mistake backend/nginx.conf's old CSP made for the
    # split-domain setup). Add one only after testing it against this exact
    # combined origin with the browser console open.

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Matches Multer's largest cap (10MB documents) -- applies to both the
    # /api/ upload endpoints and the SPA's own asset requests.
    client_max_body_size 10M;

    # ---- Backend: REST API ---------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- Backend: Socket.IO (needs the WebSocket upgrade headers and much
    #      longer timeouts than a normal HTTP request) -------------------------
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---- Backend: uploaded file delivery -- deliberately NOT under /api/v1,
    #      so it needs its own location block or it would fall through to the
    #      frontend catch-all below and 404/serve index.html instead. --------
    location /files/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Backend: health probes -- also mounted at the app root, not under
    #      /api/v1 (see backend/src/app.ts). Same reasoning as /files/ above:
    #      without this, hitting /health here would silently return the SPA's
    #      index.html instead of the real health JSON, breaking monitoring. --
    location ~ ^/(live|ready|health|version)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Everything else: the frontend container -----------------------------
    # frontend/nginx.conf (running inside that container, listening on 8080)
    # does the actual SPA fallback (try_files ... /index.html) and static
    # asset caching -- this just proxies through to it.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Don't serve dotfiles if any ever end up reachable.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
