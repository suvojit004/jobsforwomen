# =============================================================================
# PRODUCTION compose file for the jobsforwomen.info EC2 host.
#
# This is deliberately a SEPARATE file from backend/docker-compose.yml.
# That one is a local/dev sandbox: it creates its own throwaway Postgres +
# Redis containers with an empty database, and binds ports 5000/8080 openly.
# Running it on this server would collide with the containers below (same
# ports) and, if the collision were somehow avoided, would stand up a brand
# new EMPTY database completely disconnected from real production data.
# Neither compose file starts the other's services -- keep them separate.
#
# What THIS file does NOT do, on purpose:
#   - No `db` or `redis` services. Point DATABASE_URL / REDIS_URL (in the
#     real backend/.env on this server) at whatever you're actually using
#     in production -- a managed Postgres/Redis, or your existing jfw-db /
#     jfw-redis containers if those hold the real data. This file only
#     builds and runs the api and web application containers.
#   - No secrets in this file. DATABASE_URL, REDIS_URL, JWT_ACCESS_SECRET,
#     JWT_REFRESH_SECRET, AWS SES credentials, GOOGLE_CLIENT_SECRET, etc.
#     all come from `env_file: .env` below -- the same production .env file
#     described in docs/16_DEPLOYMENT.md, never checked into git
#     (backend/.dockerignore already excludes it from the image).
#
# ---- BEFORE running this on the server ------------------------------------
#
# You already have containers named jobsforwomen-api / jobsforwomen-web
# running from earlier `docker run` commands (per docs/16_DEPLOYMENT.md
# §16.4/§16.7). Docker will refuse to create new containers with the same
# names while the old ones exist, so stop and remove them first:
#
#   docker stop jobsforwomen-api jobsforwomen-web
#   docker rm jobsforwomen-api jobsforwomen-web
#
# Also confirm the real uploads volume name before running this file --
# `docker volume ls` -- and change `jfw_uploads` below (in the `web`... no,
# `api` service's volumes: line, and in the `volumes:` block at the bottom)
# to match if your existing volume has a different name. Using the wrong
# name here creates a second, empty volume instead of reattaching to the
# one with your real uploaded files.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# =============================================================================

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: jobsforwomen-api:latest
    container_name: jobsforwomen-api
    restart: unless-stopped
    # Bound to loopback only, matching backend/nginx.conf's
    # `proxy_pass http://localhost:5000` -- the host nginx (backend/nginx.conf)
    # is what actually faces the internet on 443 for api.jobsforwomen.info.
    # Publishing this on 0.0.0.0 would let anyone reach the API directly over
    # plain HTTP, bypassing TLS and the security headers nginx adds.
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      # Not secrets -- safe to set explicitly here rather than relying on
      # .env, matching the -e flags in docs/16_DEPLOYMENT.md's docker run
      # recipe. Everything actually sensitive (DATABASE_URL, REDIS_URL,
      # JWT secrets, SES/Google credentials, CLIENT_URL/FRONTEND_URL, etc.)
      # stays in .env via env_file above -- verify those already point at
      # your real production database/Redis before starting this.
      - NODE_ENV=production
      - PORT=5000
      - BACKEND_URL=https://api.jobsforwomen.info
    volumes:
      # `external: true` below means compose will NOT create a new volume --
      # it reattaches to whatever named volume already holds your real
      # uploaded files. If that volume has a different name, this fails
      # loudly with "volume not found" rather than silently creating an
      # empty one -- fix the name, don't remove `external: true`.
      - jfw_uploads:/app/uploads

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # BUILD-TIME arg -- baked into the JS bundle by Vite. Must be the
        # real public API origin the browser will call.
        VITE_API_URL: https://api.jobsforwomen.info
    image: jobsforwomen-web:latest
    container_name: jobsforwomen-web
    restart: unless-stopped
    # Same reasoning as api's port binding above -- frontend/nginx.host.conf
    # assumes `-p 127.0.0.1:8080:8080` and reverse-proxies to it from 443.
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  jfw_uploads:
    external: true
