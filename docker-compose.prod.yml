# =============================================================================
# JobsForWomen -- PRODUCTION compose file (Hostinger VPS).
#
# This is NOT the same file as backend/docker-compose.yml -- that one is the
# local/dev stack (throwaway Postgres+Redis, BYPASS_EMAIL_VERIFICATION set,
# VITE_API_URL hardcoded to localhost:5000). Running that one here would
# reproduce the exact "Google OAuth redirects to localhost" bug already fixed
# once.
#
# ARCHITECTURE CHANGE from the previous version of this file: Postgres and
# Redis are now CONTAINERIZED here (`db`, `redis` below), not host-native.
# Previously this file deliberately had no db/redis services because
# Postgres/Redis were confirmed running natively on this VPS. That is no
# longer the assumption -- read the pre-flight section below in full before
# deploying this, especially step 1.
#
# =============================================================================
# !! DATA MIGRATION WARNING -- READ BEFORE THE FIRST DEPLOY WITH THIS FILE !!
#
# The `db` service below starts with a completely EMPTY Postgres database --
# a fresh named volume, no tables, no rows. `migrate` will run every Prisma
# migration against it and create the schema, but an empty schema, not your
# real data. Your actual production data (users, companies, jobs,
# applications, everything) currently lives in whatever Postgres install this
# VPS was using before this file existed. If that was the host-native
# Postgres from the prior setup, you MUST dump it and restore it into this
# new containerized one BEFORE pointing real traffic at this stack, or it
# will look exactly like every user and job vanished.
#
# From the VPS, before running `docker compose up` for the first time:
#
#   # 1. Dump the OLD database (adjust host/user/db name to match reality):
#   pg_dump -h localhost -U postgres -d jobsforwomen -Fc -f jobsforwomen_backup.dump
#
#   # 2. Start ONLY the new db container (not api/migrate/web yet):
#   docker compose -f docker-compose.prod.yml up -d db
#   docker compose -f docker-compose.prod.yml logs -f db   # wait for "ready to accept connections"
#
#   # 3. Restore the dump INTO the new container:
#   docker cp jobsforwomen_backup.dump jobsforwomen-db:/tmp/backup.dump
#   docker exec jobsforwomen-db pg_restore -U postgres -d jobsforwomen --clean --if-exists /tmp/backup.dump
#
#   # 4. Only now bring up the rest of the stack:
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Skipping this turns "add containerized Postgres" into "silently lose
# production data." If you're deploying this to a genuinely fresh/new server
# with no existing data at all, ignore this section -- an empty database is
# correct in that case.
# =============================================================================
#
# PRE-FLIGHT (do these once, by hand, before the first real `docker compose up`):
#
#   1. Do the data migration above if this VPS has existing production data
#      in a different Postgres instance (host-native or otherwise).
#
#   2. Stop/remove any containers started with plain `docker run` previously,
#      and stop the OLD host-native Postgres/Redis once the data migration
#      above is confirmed working (don't stop it before -- you need it
#      running to pg_dump from it):
#        docker stop jfw-api jfw-web 2>/dev/null; docker rm jfw-api jfw-web 2>/dev/null
#        sudo systemctl stop postgresql redis-server   # only after step 1 is verified
#        sudo systemctl disable postgresql redis-server
#
#   3. Confirm the uploads volume name below (`jfw_uploads`) matches whatever
#      already has your real uploaded files in it:
#        docker volume ls | grep uploads
#      If it's named differently, either rename it or change `external: true`
#      below to point at the real name -- do NOT let compose create a new
#      empty volume with this name, or every existing upload becomes
#      unreachable (the files are still on disk, just orphaned). This is
#      unrelated to the Postgres data migration above -- uploaded files and
#      database rows are stored completely separately.
#
#   4. Set POSTGRES_PASSWORD in `backend/.env` -- both `migrate` and `api`
#      load their env from `backend/.env` (not a repo-root `.env`; there
#      isn't one, and this avoids maintaining secrets in two places).
#      POSTGRES_PASSWORD is used both to initialize the `db` container below
#      AND must match the password portion of DATABASE_URL. Also update
#      DATABASE_URL/REDIS_URL in `backend/.env` to point at the container
#      service names now (`db`, `redis`), not `localhost` or
#      `host.docker.internal`:
#        DATABASE_URL="postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/jobsforwomen?schema=public"
#        REDIS_URL="redis://redis:6379"
#
#   5. Confirm `backend/.env` has BACKEND_URL, CLIENT_URL, FRONTEND_URL, and
#      GOOGLE_CALLBACK_URL all set to https://portal.jobsforwomen.info (with
#      GOOGLE_CALLBACK_URL as https://portal.jobsforwomen.info/api/v1/auth/google/callback).
#      See portal.nginx.conf for the matching single-domain nginx routing.
#
# DEPLOY (every time, going forward -- after the one-time migration above):
#
#   docker compose -f docker-compose.prod.yml up --build -d
#
# `migrate` won't even start until `db` reports healthy, and `api` won't
# start until `migrate` exits 0 -- so there's no window where the app runs
# against an unreachable or unmigrated database.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL. Real, persistent data now -- not the throwaway db in
  # backend/docker-compose.yml. `pgdata` is a normal (non-external) named
  # volume: compose creates it if missing, which is correct for THIS volume
  # (unlike jfw_uploads below) as long as you've done the restore in the
  # warning above first.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: jobsforwomen-db
    restart: unless-stopped
    # env_file (not `environment: ${POSTGRES_PASSWORD}`) so POSTGRES_PASSWORD
    # comes straight from backend/.env into the container. The old
    # `${POSTGRES_PASSWORD}` form is a COMPOSE-level substitution -- resolved
    # by Compose itself at parse time from the shell env or a `.env` file
    # next to this compose file (repo root), NOT from env_file: entries.
    # With no root .env, that substitution silently resolved to blank.
    env_file:
      - backend/.env
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=jobsforwomen
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db-net
    # No host port mapping -- `api`/`migrate` reach this over the Docker
    # network by service name (`db:5432`), so publishing to the host isn't
    # required. If you ever want a GUI tool (psql/DBeaver) or an SSH tunnel
    # straight into this container, add back:
    #   ports:
    #     - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobsforwomen"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis. `--appendonly yes` persists queued BullMQ jobs / rate-limit state /
  # permission cache across container restarts -- worth having now that this
  # is the real production instance, not a disposable dev cache.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: jobsforwomen-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - db-net
    # No host port mapping -- `api`/`migrate` reach this over the Docker
    # network by service name (`redis:6379`). Add back if you need
    # redis-cli/tunnel access from the VPS shell:
    #   ports:
    #     - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # One-off migration runner. Builds/reuses the same image as `api`, runs
  # `prisma migrate deploy`, then exits. `restart: "no"` is deliberate -- this
  # is meant to run once per deploy, not loop or stay up. Won't even start
  # until `db` reports healthy.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: jobsforwomen-api:latest
    env_file:
      - backend/.env
    environment:
      - NODE_ENV=production
    networks:
      - db-net
    depends_on:
      db:
        condition: service_healthy
    command: npx prisma migrate deploy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Backend API. Only starts once `db`/`redis` are healthy AND `migrate` has
  # completed successfully.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: jobsforwomen-api:latest
    container_name: jobsforwomen-api
    env_file:
      - backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    networks:
      - app-net
      - db-net
    # No host port mapping -- this VPS already has other apps holding
    # 5000/8080/etc. on the host, and none is needed: Traefik reaches this
    # container directly over `traefik-net` by its internal port (5000),
    # via the labels below. portal.nginx.conf is NOT used on this server --
    # Traefik already owns :80/:443 host-wide, so nginx can't bind them here.
    volumes:
      - jfw_uploads:/app/uploads
    labels:
    
      # Higher priority than web's Host-only rule below, so /api, /socket.io,
      # /files and the health probes go to this container and everything
      # else falls through to `web`. (/live /ready /health /version are
      # mounted at the app root, not under /api/v1 -- see backend/src/app.ts.)
      traefik.http.routers.jfw-api.rule: "Host(`portal.jobsforwomen.info`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`) || PathPrefix(`/files`) || Path(`/live`) || Path(`/ready`) || Path(`/health`) || Path(`/version`))"
      traefik.http.routers.jfw-api.entrypoints: "websecure"
      traefik.http.routers.jfw-api.tls: "true"
      traefik.http.routers.jfw-api.tls.certresolver: "letsencrypt"
      traefik.http.routers.jfw-api.priority: "10"
      traefik.http.services.jfw-api.loadbalancer.server.port: "5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend. VITE_API_URL is a BUILD-TIME arg (baked into the JS bundle) --
  # this is exactly the value that was wrong when Google OAuth was redirecting
  # to localhost. Must match GOOGLE_CALLBACK_URL's domain and what's
  # registered in Google Cloud Console. Setting it only in `environment:`
  # would do nothing; Vite already compiled it into the bundle by build time.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://portal.jobsforwomen.info
    image: jobsforwomen-web:latest
    container_name: jobsforwomen-web
    networks:
      - app-net
      
    depends_on:
      - api
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      # Catch-all: lower priority than jfw-api's rule on the `api` service,
      # so /api, /socket.io, /files and the health probes go there first and
      # everything else (the SPA) lands here.
      traefik.http.routers.jfw.rule: "Host(`portal.jobsforwomen.info`)"
      traefik.http.routers.jfw.entrypoints: "websecure"
      traefik.http.routers.jfw.tls: "true"
      traefik.http.routers.jfw.tls.certresolver: "letsencrypt"
      traefik.http.routers.jfw.priority: "1"
      traefik.http.services.jfw.loadbalancer.server.port: "8080"

networks:
  app-net:
    driver: bridge
  db-net:
    driver: bridge

volumes:
  jfw_uploads:
  pgdata:
  redisdata:
