services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Overrides whatever DATABASE_URL/REDIS_URL are set to in .env (likely
      # your real remote Render/Upstash instances) so `docker compose up`
      # is fully self-contained and never touches production data -- points
      # at the local `db`/`redis` containers defined below instead. Delete
      # these two lines if you'd rather test against your real remote data.
      - DATABASE_URL=postgresql://postgres:root@db:5432/jobsforwomen
      - REDIS_URL=redis://redis:6379
      # Local-disk file storage (replaces Cloudinary). BACKEND_URL is
      # localhost:5000 since that's the host-mapped port above; the volume
      # below is what makes /app/uploads survive `docker compose down` (a
      # container restart alone) -- it does NOT survive `docker compose
      # down -v`, which deletes volumes too. That's the actual test: bring
      # the stack down and up again *without* -v and confirm an uploaded
      # file is still there.
      - DISK_MOUNT_PATH=/app/uploads
      - BACKEND_URL=http://localhost:5000
      # Lets the `web` service's origin (http://localhost:8080, the
      # frontend container's published port -- see below) through CORS for
      # both REST (app.ts) and Socket.IO (shared/socket/socket.ts), which
      # both read CLIENT_URL/FRONTEND_URL. This is additive: app.ts also
      # hardcodes localhost:5173, so `npm run dev` on the frontend still
      # works unaffected alongside this container.
      - CLIENT_URL=http://localhost:8080
      - FRONTEND_URL=http://localhost:8080
      # LOCAL/TEST ONLY -- lets a seeded load-test account skip the
      # email-verification link so it can log in immediately. auth.service.ts
      # only honors this for accounts already in PendingVerification status;
      # never set this in the real Render environment.
      - BYPASS_EMAIL_VERIFICATION=true
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net
      - db-net
    restart: unless-stopped

  # Frontend static build, served by the nginx image defined in
  # frontend/Dockerfile. This is the SAME production Dockerfile used for
  # real deploys -- there's no dev-server/HMR mode here, so editing frontend
  # source requires `docker compose up --build web` to see the change.
  # For day-to-day frontend development, run `npm run dev` in frontend/
  # instead and leave this service stopped; it exists so the full stack
  # (frontend + api + db + redis) can be brought up with one command when
  # you actually want to test the production-style build end to end.
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # BUILD-TIME arg -- Vite bakes this into the JS bundle, so it must
        # be the URL the BROWSER can reach, not an internal Docker hostname
        # like "http://api:5000". The api service above publishes 5000 to
        # the host, so localhost:5000 is correct here. Changing this later
        # requires rebuilding the image (`docker compose build web`); a
        # plain `docker compose up` reuses the already-baked bundle.
        VITE_API_URL: http://localhost:5000
    ports:
      - "8080:8080"
    depends_on:
      - api
    networks:
      - app-net
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=jobsforwomen
    # No host port mapping -- the `api` container reaches this one over
    # Docker's internal network as `db:5432` regardless, and Windows kept
    # refusing to bind ANY host port here ("forbidden by its access
    # permissions" on both 5432 and 5433), which points at a Windows-level
    # restriction (stuck `winnat` service / Hyper-V dynamic port range)
    # rather than a real conflict. If you want to connect a GUI tool
    # (psql/DBeaver/TablePlus) from Windows directly, add back a
    # "127.0.0.1:<port>:5432" mapping once that's sorted out -- see
    # `net stop winnat && net start winnat` (run as Administrator) as the
    # usual fix for this class of error.
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobsforwomen"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    # No host port mapping, same reasoning as the db service above -- api
    # reaches this over the internal Docker network as `redis:6379`.
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-net:
    driver: bridge
  db-net:
    driver: bridge

volumes:
  pgdata:
  uploads_data:
